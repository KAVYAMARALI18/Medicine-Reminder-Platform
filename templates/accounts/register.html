{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register - Medicine Reminder{% endblock %}

{% block auth_content %}
<div class="auth-wrapper py-5">
    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary"><i class="fa-solid fa-notes-medical me-2"></i>MedRemind</h3>
            <p class="text-muted">Create a new account</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary w-100 py-2 mt-3 fw-bold" type="submit">Sign Up</button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted small">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
