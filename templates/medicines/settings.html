{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Settings - Medicine Reminder{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Settings</h2>
</div>

<div class="card border-0 p-4 shadow-sm">
    <form method="POST">
        {% csrf_token %}
        <div class="row g-4">
            <div class="col-md-6">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Preferences</h5>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="darkMode" name="dark_mode" {% if user.dark_mode %}checked{% endif %}>
                    <label class="form-check-label" for="darkMode">Enable Dark Mode</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="sound" name="sound_enabled" {% if user.sound_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="sound">Enable Sound Notifications</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="desktop" name="desktop_notifications" {% if user.desktop_notifications_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="desktop">Enable Desktop Notifications</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="email" name="email_notifications_enabled" {% if user.email_notifications_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="email">Enable Email Notifications</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="sms" name="sms_notifications_enabled" {% if user.sms_notifications_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="sms">Enable SMS Notifications</label>
                </div>
                <div class="mb-3">
                    <label for="sms_phone_number" class="form-label">SMS Phone Number</label>
                    <input type="tel" class="form-control" id="sms_phone_number" name="sms_phone_number" value="{{ user.sms_phone_number|default:'' }}">
                </div>
                <div class="mb-3">
                    <label for="language" class="form-label">Language</label>
                    <select class="form-select" id="language" name="language">
                        <option value="en" {% if user.language == 'en' %}selected{% endif %}>English</option>
                        <option value="es" {% if user.language == 'es' %}selected{% endif %}>Spanish</option>
                    </select>
                </div>
            </div>

            <div class="col-md-6">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Emergency Information</h5>
                <p class="text-muted">Manage your emergency contacts and medical information in your Profile.</p>
                <a href="{% url 'profile' %}" class="btn btn-outline-primary">Go to Profile</a>
            </div>
        </div>

        <div class="text-end mt-4">
            <button type="submit" class="btn btn-primary fw-bold px-4">Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
