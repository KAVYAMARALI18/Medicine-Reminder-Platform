{% extends "base.html" %}

{% block title %}Calendar - Medicine Reminder{% endblock %}

{% block extra_head %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Calendar View</h2>
</div>

<div class="card border-0 p-4 shadow-sm">
    <div id='calendar'></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            themeSystem: 'bootstrap5',
            events: [
                // We'll populate this with API data soon
                {
                    title: 'Dummy Medicine (08:00 AM)',
                    start: '{{ today|date:"Y-m-d" }}T08:00:00'
                }
            ]
        });
        calendar.render();
    });
</script>
{% endblock %}
